name: Recommendation proposal
description: Suggest one weapon roll for the community wishlist
title: "[Recommendation proposal] "
body:
  - type: markdown
    attributes:
      value: |
        Submit one roll per issue. Fill in every field. Your suggestion may appear in the community wishlist with your GitHub username. Do not include private information.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Choose PvE or PvP.
      options:
        - PvE
        - PvP
      default: 0
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: A short name for this roll.
      placeholder: Solar add-clear
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is this roll meant to do?
      placeholder: Boss damage, add clear, or Crucible duels
      render: text
    validations:
      required: true
  - type: input
    id: weapon
    attributes:
      label: Weapon
      description: Enter the exact weapon version ID.
      placeholder: avalanche_s5
    validations:
      required: true
  - type: input
    id: perk1
    attributes:
      label: Perk 1
      description: Enter a perk name. The order does not matter.
      placeholder: Perk name
    validations:
      required: true
  - type: input
    id: perk2
    attributes:
      label: Perk 2
      description: Enter a perk name.
      placeholder: Perk name
    validations:
      required: true
  - type: input
    id: perk3
    attributes:
      label: Perk 3
      description: Enter a perk name.
      placeholder: Perk name
    validations:
      required: true
  - type: input
    id: perk4
    attributes:
      label: Perk 4
      description: Enter a perk name.
      placeholder: Perk name
    validations:
      required: true
