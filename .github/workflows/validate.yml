name: Validate data and tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate workflow security invariants
        run: python scripts/check_workflow_security.py
      - name: Validate all data and cross-references
        run: python scripts/validate_json.py
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Ensure curated DIM wishlist is current
        run: python scripts/export_dim_wishlist.py --source curated --check
      - name: Ensure community DIM wishlist is current
        run: python scripts/export_dim_wishlist.py --source community --check

  test-generator:
    name: Node.js weapon perk-pool generator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run generator regression tests
        run: node --test tests/test_generate_weapon_perk_pools.mjs

      - name: Test recommendation-intake outcome classification
        run: node --test tests/test_recommendation_intake_outcome.cjs
      - name: Test immutable recommendation snapshots
        run: node --test tests/test_recommendation_snapshot.cjs
